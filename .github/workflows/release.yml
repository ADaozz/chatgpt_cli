name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        id: build
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          npm run pack:min

          STAGING="dist/chatgpt-cli-${VERSION}"
          mkdir -p "${STAGING}"
          cp README.md index.js cli.js client.js adapter.js commands.js \
            auto-connect.js browser.js renderer.js theme.js response-tracker.js \
            conversation-completion.js selectors.js session.js \
            package.json package-lock.json "${STAGING}/"
          tar -czf "dist/chatgpt-cli-${VERSION}-minimal.tar.gz" -C dist "chatgpt-cli-${VERSION}"

          (
            cd dist
            sha256sum "chatgpt-cli-${VERSION}.tgz" \
              "chatgpt-cli-${VERSION}-minimal.tar.gz" \
              > "SHA256SUMS-v${VERSION}.txt"
          )

      - name: Remove existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.build.outputs.tag }}
          generate_release_notes: false
          body: |
            ## 亮点

            - `status --wait` 结合 backend `async_status` / `is_reasoning` 与 DOM 稳定窗口，避免 thinking 进度说明被误判完成
            - Skill 增加模式确认：upload / send / start 前须四选一（analysis / review / verify / implementation）
            - 新增 `conversation-completion.js` 与完成信号单测

            ## 安装

            ```bash
            git clone git@github.com:ADaozz/chatgpt_cli.git
            cd chatgpt_cli && npm install && node cli.js
            ```

            或下载 **minimal** 包：

            ```bash
            tar xzf chatgpt-cli-${{ steps.build.outputs.version }}-minimal.tar.gz
            cd chatgpt-cli-${{ steps.build.outputs.version }} && npm install && node cli.js
            ```

            ## 资源

            | 文件 | 说明 |
            |------|------|
            | `chatgpt-cli-*-minimal.tar.gz` | 最小可运行包，解压后 `npm install && node cli.js` |
            | `chatgpt-cli-*.tgz` | `npm pack` 产物 |
            | `SHA256SUMS-*.txt` | SHA256 校验和 |
          files: |
            dist/chatgpt-cli-${{ steps.build.outputs.version }}.tgz
            dist/chatgpt-cli-${{ steps.build.outputs.version }}-minimal.tar.gz
            dist/SHA256SUMS-v${{ steps.build.outputs.version }}.txt
